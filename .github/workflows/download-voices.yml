          download "bryan-johnson" "https://upload.wikimedia.org/wikipedia/commons/c/c4/Bryan_Johnson_%28entrepreneur%29_%28cropped%29.jpg"
          download "nir-barzilai" "https://upload.wikimedia.org/wikipedia/commons/b/b8/Nir_Barzilai_%28cropped%29.jpg"
          download "daniel-kraft" "https://upload.wikimedia.org/wikipedia/commons/6/6e/Daniel_Kraft_2018_%28cropped%29.jpg"
          download "atul-butte" "https://upload.wikimedia.org/wikipedia/commons/a/a5/Atul_Butte_%28cropped%29.jpg"

          # Robotics & Space
          download "brett-adcock" "https://upload.wikimedia.org/wikipedia/commons/f/f9/Brett_Adcock_%28cropped%29.jpg"
          download "marc-raibert" "https://upload.wikimedia.org/wikipedia/commons/4/4e/Marc_Raibert_2019_%28cropped%29.jpg"
          download "peter-beck" "https://upload.wikimedia.org/wikipedia/commons/8/84/Peter_Beck_%28Rocket_Lab%29_%28cropped%29.jpg"

          # Quantum
          download "hartmut-neven" "https://upload.wikimedia.org/wikipedia/commons/5/52/Hartmut_Neven_%28cropped%29.jpg"
          download "krysta-svore" "https://upload.wikimedia.org/wikipedia/commons/e/e2/Krysta_Svore_%28cropped%29.jpg"
          download "john-martinis" "https://upload.wikimedia.org/wikipedia/commons/8/8a/John_Martinis_2019_%28cropped%29.jpg"
          download "jerry-chow" "https://upload.wikimedia.org/wikipedia/commons/c/c4/Jerry_Chow_IBM_%28cropped%29.jpg"
          download "alan-baratz" "https://upload.wikimedia.org/wikipedia/commons/a/a0/Alan_Baratz_D-Wave_%28cropped%29.jpg"
          download "michio-kaku" "https://upload.wikimedia.org/wikipedia/commons/4/4e/Michio_Kaku_2019_%28cropped%29.jpg"

          echo "--- Final results ---"
          ls -lh images/voices/
          echo "Valid images: $(ls images/voices/*.jpg 2>/dev/null | wc -l)"

      - name: Commit voice photos
        run: |
          git config user.name "vursyl-bot"
          git config user.email "info@vursyl.com"
          git add images/voices/
          git diff --staged --quiet || git commit -m "Add converted voice profile photos [skip ci]"
          git push

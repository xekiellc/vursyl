name: Download Voice Photos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Download and process voice photos
        run: |
          cat > /tmp/download_voices.py << 'PYEOF'
          import requests
          import os
          import time
          from PIL import Image
          from io import BytesIO

          os.makedirs("images/voices", exist_ok=True)

          # Use Wikimedia REST API — designed for programmatic access
          # Format: https://en.wikipedia.org/api/rest_v1/page/summary/{title}
          # Returns thumbnail URL we can fetch safely

          HEADERS = {
              "User-Agent": "VursylBot/1.0 (https://vursyl.com; info@vursyl.com) python-requests/2.31",
              "Api-User-Agent": "VursylBot/1.0 (https://vursyl.com; info@vursyl.com)",
          }

          # Wikipedia page titles for each voice
          # For non-Wikipedia sources, use direct URL prefixed with "url:"
          VOICES = [
              ("sam-altman",        "Sam_Altman"),
              ("dario-amodei",      "Dario_Amodei"),
              ("andrej-karpathy",   "Andrej_Karpathy"),
              ("demis-hassabis",    "Demis_Hassabis"),
              ("yann-lecun",        "Yann_LeCun"),
              ("geoffrey-hinton",   "Geoffrey_Hinton"),
              ("fei-fei-li",        "Fei-Fei_Li"),
              ("andrew-ng",         "Andrew_Ng"),
              ("ilya-sutskever",    "Ilya_Sutskever"),
              ("elon-musk",         "Elon_Musk"),
              ("mark-zuckerberg",   "Mark_Zuckerberg"),
              ("satya-nadella",     "Satya_Nadella"),
              ("lex-fridman",       "Lex_Fridman"),
              ("kai-fu-lee",        "Kai-Fu_Lee"),
              ("peter-diamandis",   "Peter_Diamandis"),
              ("logan-kilpatrick",  "url:https://pbs.twimg.com/profile_images/1876690893879025664/eYFMCGpW_400x400.jpg"),
              ("sebastian-raschka", "url:https://avatars.githubusercontent.com/u/13906417?v=4"),
              ("jensen-huang",      "Jensen_Huang"),
              ("bernard-marr",      "Bernard_Marr"),
              ("kate-crawford",     "Kate_Crawford_(scholar)"),
              ("scott-galloway",    "Scott_Galloway_(professor)"),
              ("eric-topol",        "Eric_Topol"),
              ("bob-wachter",       "Bob_Wachter"),
              ("shiv-rao",          "url:https://media.licdn.com/dms/image/v2/D5603AQGsomething/profile-displayphoto-shrink_200_200/0/1234"),
              ("david-sinclair",    "David_Sinclair_(biologist)"),
              ("jennifer-doudna",   "Jennifer_Doudna"),
              ("feng-zhang",        "Feng_Zhang"),
              ("george-church",     "George_Church_(geneticist)"),
              ("peter-attia",       "Peter_Attia"),
              ("bryan-johnson",     "Bryan_Johnson_(entrepreneur)"),
              ("nir-barzilai",      "Nir_Barzilai"),
              ("daniel-kraft",      "Daniel_Kraft"),
              ("atul-butte",        "Atul_Butte"),
              ("brett-adcock",      "Brett_Adcock"),
              ("marc-raibert",      "Marc_Raibert"),
              ("peter-beck",        "Peter_Beck_(entrepreneur)"),
              ("hartmut-neven",     "Hartmut_Neven"),
              ("krysta-svore",      "Krysta_Svore"),
              ("john-martinis",     "John_Martinis"),
              ("jerry-chow",        "url:https://research.ibm.com/people/jerry-chow"),
              ("alan-baratz",       "Alan_Baratz"),
              ("michio-kaku",       "Michio_Kaku"),
          ]

          def save_image(slug, img_url):
              out = f"images/voices/{slug}.jpg"
              try:
                  r = requests.get(img_url, headers=HEADERS, timeout=20)
                  r.raise_for_status()
                  img = Image.open(BytesIO(r.content)).convert("RGB")
                  w, h = img.size
                  side = min(w, h)
                  img = img.crop(((w-side)//2, (h-side)//2, (w+side)//2, (h+side)//2))
                  img = img.resize((200, 200), Image.LANCZOS)
                  img.save(out, "JPEG", quality=85)
                  print(f"  OK: {slug}")
                  return True
              except Exception as e:
                  print(f"  FAILED image fetch: {slug} — {e}")
                  return False

          ok, failed = 0, []

          for slug, source in VOICES:
              print(f"Processing {slug}...")
              time.sleep(1)  # 1 second between every request

              if source.startswith("url:"):
                  img_url = source[4:]
                  if save_image(slug, img_url):
                      ok += 1
                  else:
                      failed.append(slug)
                  continue

              # Use Wikipedia REST API summary endpoint
              api_url = f"https://en.wikipedia.org/api/rest_v1/page/summary/{source}"
              try:
                  r = requests.get(api_url, headers=HEADERS, timeout=15)
                  r.raise_for_status()
                  data = r.json()
                  thumb = data.get("thumbnail", {}).get("source", "")
                  original = data.get("originalimage", {}).get("source", "")
                  img_url = original or thumb
                  if not img_url:
                      print(f"  No image in API response: {slug}")
                      failed.append(slug)
                      continue
                  # Use larger thumbnail
                  img_url = img_url.replace("/200px-", "/400px-")
                  time.sleep(0.5)
                  if save_image(slug, img_url):
                      ok += 1
                  else:
                      failed.append(slug)
              except Exception as e:
                  print(f"  API error: {slug} — {e}")
                  failed.append(slug)

          print(f"\nDone: {ok} OK, {len(failed)} failed")
          if failed:
              print("Failed slugs:", failed)
          PYEOF
          python /tmp/download_voices.py

      - name: Commit voice photos
        run: |
          git config user.name "vursyl-bot"
          git config user.email "info@vursyl.com"
          git add images/voices/
          git diff --staged --quiet || git commit -m "Add voice photos via Wikipedia API [skip ci]"
          git push

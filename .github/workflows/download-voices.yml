name: Download Voice Photos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download voice photos
        run: |
          mkdir -p images/voices
          download() {
            local slug=$1
            local url=$2
            local out="images/voices/${slug}.jpg"
            if [ -f "$out" ]; then
              echo "Already exists: $out"
              return
            fi
            echo "Downloading $slug..."
            curl -sL --max-time 15 \
              -H "User-Agent: Mozilla/5.0 (compatible; VursylBot/1.0)" \
              "$url" -o "$out"
            if [ $? -eq 0 ] && [ -s "$out" ]; then
              echo "  OK: $out"
            else
              echo "  FAILED: $slug ($url)"
              rm -f "$out"
            fi
          }

          # AI & LLMs
          download "sam-altman" "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Sam_Altman_CogX_2023_%28cropped%29.jpg/440px-Sam_Altman_CogX_2023_%28cropped%29.jpg"
          download "dario-amodei" "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Dario_Amodei_2024_%28cropped%29.jpg/440px-Dario_Amodei_2024_%28cropped%29.jpg"
          download "andrej-karpathy" "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Andrej_Karpathy_at_Stanford_%28cropped%29.jpg/440px-Andrej_Karpathy_at_Stanford_%28cropped%29.jpg"
          download "demis-hassabis" "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Demis_Hassabis_Royal_Society.jpg/440px-Demis_Hassabis_Royal_Society.jpg"
          download "yann-lecun" "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Yann_LeCun_-_2020.jpg/440px-Yann_LeCun_-_2020.jpg"
          download "geoffrey-hinton" "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Geoffrey_Hinton_at_UBC_%28cropped%29.jpg/440px-Geoffrey_Hinton_at_UBC_%28cropped%29.jpg"
          download "fei-fei-li" "https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Fei-Fei_Li_2024_%28cropped%29.jpg/440px-Fei-Fei_Li_2024_%28cropped%29.jpg"
          download "andrew-ng" "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Andrew_Ng_at_AI_For_Good_2017_%28cropped%29.jpg/440px-Andrew_Ng_at_AI_For_Good_2017_%28cropped%29.jpg"
          download "ilya-sutskever" "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Ilya_Sutskever_2019_%28cropped%29.jpg/440px-Ilya_Sutskever_2019_%28cropped%29.jpg"
          download "elon-musk" "https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/Elon_Musk_Royal_Society_%28crop2%29.jpg/440px-Elon_Musk_Royal_Society_%28crop2%29.jpg"
          download "mark-zuckerberg" "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Mark_Zuckerberg_F8_2019_Keynote_%2832830578717%29_%28cropped%29.jpg/440px-Mark_Zuckerberg_F8_2019_Keynote_%2832830578717%29_%28cropped%29.jpg"
          download "satya-nadella" "https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/MS-Exec-Nadella-Satya-2017-08-31-22_%28cropped%29.jpg/440px-MS-Exec-Nadella-Satya-2017-08-31-22_%28cropped%29.jpg"
          download "sebastian-raschka" "https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Sebastian_Raschka_2022_%28cropped%29.jpg/440px-Sebastian_Raschka_2022_%28cropped%29.jpg"
          download "lex-fridman" "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Lex_Fridman_2024_%28cropped%29.jpg/440px-Lex_Fridman_2024_%28cropped%29.jpg"
          download "kai-fu-lee" "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Kai-Fu_Lee_2019_%28cropped%29.jpg/440px-Kai-Fu_Lee_2019_%28cropped%29.jpg"
          download "logan-kilpatrick" "https://pbs.twimg.com/profile_images/1683482893879025664/eYFMCGpW_400x400.jpg"
          download "peter-diamandis" "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Peter_Diamandis_2019_%28cropped%29.jpg/440px-Peter_Diamandis_2019_%28cropped%29.jpg"

          # Compute & Data
          download "jensen-huang" "https://upload.wikimedia.org/wikipedia/commons/thumb/3/35/Jensen_Huang_at_CES_2024_%28cropped%29.jpg/440px-Jensen_Huang_at_CES_2024_%28cropped%29.jpg"
          download "bernard-marr" "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Bernard_Marr_%28cropped%29.jpg/440px-Bernard_Marr_%28cropped%29.jpg"
          download "kate-crawford" "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Kate_Crawford_2019_%28cropped%29.jpg/440px-Kate_Crawford_2019_%28cropped%29.jpg"
          download "scott-galloway" "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Scott_Galloway_2022_%28cropped%29.jpg/440px-Scott_Galloway_2022_%28cropped%29.jpg"

          # Health & Bio
          download "eric-topol" "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Eric_Topol_2019_%28cropped%29.jpg/440px-Eric_Topol_2019_%28cropped%29.jpg"
          download "bob-wachter" "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Bob_Wachter_2019_%28cropped%29.jpg/440px-Bob_Wachter_2019_%28cropped%29.jpg"
          download "shiv-rao" "https://pbs.twimg.com/profile_images/1671937663303208960/QKqxOjHT_400x400.jpg"
          download "david-sinclair" "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/David_Sinclair_2020_%28cropped%29.jpg/440px-David_Sinclair_2020_%28cropped%29.jpg"
          download "jennifer-doudna" "https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Jennifer_Doudna_DP_2723_%28cropped%29.jpg/440px-Jennifer_Doudna_DP_2723_%28cropped%29.jpg"
          download "feng-zhang" "https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Feng_Zhang_%28scientist%29.jpg/440px-Feng_Zhang_%28scientist%29.jpg"
          download "george-church" "https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/George_Church.jpg/440px-George_Church.jpg"
          download "peter-attia" "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Peter_Attia_2023_%28cropped%29.jpg/440px-Peter_Attia_2023_%28cropped%29.jpg"
          download "bryan-johnson" "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Bryan_Johnson_%28entrepreneur%29_%28cropped%29.jpg/440px-Bryan_Johnson_%28entrepreneur%29_%28cropped%29.jpg"
          download "nir-barzilai" "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/Nir_Barzilai_%28cropped%29.jpg/440px-Nir_Barzilai_%28cropped%29.jpg"
          download "daniel-kraft" "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Daniel_Kraft_2018_%28cropped%29.jpg/440px-Daniel_Kraft_2018_%28cropped%29.jpg"
          download "atul-butte" "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Atul_Butte_%28cropped%29.jpg/440px-Atul_Butte_%28cropped%29.jpg"

          # Robotics & Space
          download "brett-adcock" "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Brett_Adcock_%28cropped%29.jpg/440px-Brett_Adcock_%28cropped%29.jpg"
          download "marc-raibert" "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Marc_Raibert_2019_%28cropped%29.jpg/440px-Marc_Raibert_2019_%28cropped%29.jpg"
          download "peter-beck" "https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Peter_Beck_%28Rocket_Lab%29_%28cropped%29.jpg/440px-Peter_Beck_%28Rocket_Lab%29_%28cropped%29.jpg"

          # Quantum
          download "hartmut-neven" "https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Hartmut_Neven_%28cropped%29.jpg/440px-Hartmut_Neven_%28cropped%29.jpg"
          download "krysta-svore" "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Krysta_Svore_%28cropped%29.jpg/440px-Krysta_Svore_%28cropped%29.jpg"
          download "john-martinis" "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/John_Martinis_2019_%28cropped%29.jpg/440px-John_Martinis_2019_%28cropped%29.jpg"
          download "jerry-chow" "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Jerry_Chow_IBM_%28cropped%29.jpg/440px-Jerry_Chow_IBM_%28cropped%29.jpg"
          download "fred-chong" "https://people.cs.uchicago.edu/~ftchong/images/chong-photo.jpg"
          download "alan-baratz" "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Alan_Baratz_D-Wave_%28cropped%29.jpg/440px-Alan_Baratz_D-Wave_%28cropped%29.jpg"
          download "michio-kaku" "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Michio_Kaku_2019_%28cropped%29.jpg/440px-Michio_Kaku_2019_%28cropped%29.jpg"

          echo "Download complete. Listing results:"
          ls -la images/voices/

      - name: Commit voice photos
        run: |
          git config user.name "vursyl-bot"
          git config user.email "info@vursyl.com"
          git add images/voices/
          git diff --staged --quiet || git commit -m "Add voice profile photos [skip ci]"
          git push

name: Update Vursyl Feed

on:
  schedule:
    # 4x daily — 06:00, 12:00, 18:00, 00:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run feed pipeline
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_feed.py

      - name: Commit and push feed data
        run: |
          git config user.name "vursyl-bot"
          git config user.email "info@vursyl.com"
          git add data/news.json data/media.json
          git diff --staged --quiet || git commit -m "Update feed data [skip ci]"
          git push
